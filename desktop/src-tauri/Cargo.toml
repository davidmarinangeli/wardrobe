[package]
name = "wardrobe-desktop"
version = "1.0.0"
description = "Wardrobe desktop app: Tauri shell around the Wardrobe Node server"
authors = ["Wardrobe contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"  # tauri-plugin-updater 2.14 requires 1.90
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "wardrobe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.6"
tauri-plugin-store = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2.7"
# In-app updates from the GitHub release's latest.json (Feature 06).
tauri-plugin-updater = "2.12"
# OS keychain: macOS Keychain and Windows Credential Manager. Tests use the
# crate's mock credential store and never touch the real keychain.
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
# Remote access (Feature 07): polls https://<machine>.ts.net/api/health. The
# same reqwest/rustls/tokio builds tauri-plugin-updater already pulls in.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
